<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Circuit — board renders</title>
<style>
  html, body { margin: 0; height: 100%; background: #070a08; color: #e8e4d8;
    font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  .wrap { display: flex; flex-direction: column; height: 100%; padding: 22px; box-sizing: border-box; gap: 14px; }
  h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }
  .meta { color: #7f8c84; font-size: 12px; }
  .row { display: flex; gap: 14px; flex: 1; min-height: 0; }
  .card { flex: 1; min-width: 0; border: 1px solid #1d2620; border-radius: 14px; overflow: hidden;
    background: radial-gradient(120% 120% at 50% 0%, #0d1712 0%, #070a08 70%); position: relative; }
  .card h2 { position: absolute; left: 12px; top: 10px; margin: 0; font-size: 11px;
    letter-spacing: 0.08em; text-transform: uppercase; color: #6d776f; font-weight: 600; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
<script type="importmap">
{ "imports": {
  "@hermes/plugin-sdk": "./stubs/plugin-sdk.js",
  "react": "./stubs/react.js",
  "react/jsx-runtime": "./stubs/jsx-runtime.js"
} }
</script></head>
<body>
<div class="wrap">
  <div>
    <h1>Pico sensor hub</h1>
    <div class="meta">72 × 50 mm · 2 layers · 13 parts · 8 nets · DRC clean</div>
  </div>
  <div class="row">
    <div class="card"><h2>3D</h2><canvas id="c3"></canvas></div>
    <div class="card"><h2>2D layer stackup</h2><canvas id="c2"></canvas></div>
  </div>
</div>
<script>
window.addEventListener('error', (e) => { document.title = 'ERR ' + (e.message || e.type) })
window.addEventListener('unhandledrejection', (e) => { document.title = 'REJ ' + (e.reason && e.reason.message || e.reason) })
</script>
<script type="module">
import { __test__ } from '../../circuit/desktop/plugin.js'

const view = await (await fetch('./board.json')).json()

function size(canvas) {
  const dpr = window.devicePixelRatio || 1
  const r = canvas.parentElement.getBoundingClientRect()
  canvas.width = Math.floor(r.width * dpr)
  canvas.height = Math.floor(r.height * dpr)
  return dpr
}

const c3 = document.getElementById('c3')
const dpr3 = size(c3)
__test__.drawBoard3D(c3.getContext('2d'), view, {
  canvas: c3, dpr: dpr3, explode: false, alpha: 1, yaw: -0.62, pitch: 0.92, dist: 120
})

const c2 = document.getElementById('c2')
const dpr2 = size(c2)
const g = c2.getContext('2d')
const W = c2.width / dpr2
const H = c2.height / dpr2
const k = Math.min((W - 60) / (view.board.width + 4), (H - 60) / (view.board.height + 4))
__test__.drawBoard2D(g, view, {
  canvas: c2,
  dpr: dpr2,
  layers: { top: true, bottom: true, silk: true, drills: true, parts: true, mask: true },
  transform: { k, ox: W / 2 - (view.board.width / 2) * k, oy: H / 2 + (view.board.height / 2) * k },
  hotNet: 'SDA'
})
document.title = 'ready'
</script>
</body></html>
